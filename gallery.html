<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Galéria - Atherion Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.33.1/dist/supabase.min.js"></script>
<style>
body{margin:0;font-family:Arial;background:#02060c;color:white;}
.header{text-align:center;font-family:'Cinzel';font-size:50px;color:#00cfff;text-shadow:0 0 30px #00cfff;margin:20px 0;}
.container{max-width:900px;margin:auto;padding:15px;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:15px;}
.gallery img{width:100%;height:120px;object-fit:cover;border-radius:8px;border:2px solid #00cfff;}
.upload-form{display:flex;flex-direction:column;gap:10px;margin-bottom:30px;}
.upload-form input, .upload-form button{padding:8px;border-radius:6px;border:2px solid #00cfff;background:#001a26;color:#00eaff;font-family:'Cinzel';}
.upload-form button{cursor:pointer;}
</style>
</head>
<body>

<div class="header">Galéria - Feltöltés</div>
<div class="container">
<form class="upload-form" id="uploadForm">
  <label>Kép kiválasztása:</label>
  <input type="file" accept="image/*" id="imgInput" required>
  <label>Dátum:</label>
  <input type="date" id="uploadDate" required>
  <label>Feltöltő neve:</label>
  <input type="text" id="uploaderName" required>
  <button type="submit">Feltöltés</button>
</form>

<div class="gallery" id="gallery"></div>
</div>

<script>
// Supabase init
const SUPABASE_URL = "https://stdlzcitdmapnsulqmdi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0ZGx6Y2l0ZG1hcG5zdWxxbWRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyNzA3OTksImV4cCI6MjA4OTg0Njc5OX0.xHbj4beiQR18X8QWraKPYT5DuslIUag-PM8zI14l0JA";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const galleryDiv = document.getElementById("gallery");
const form = document.getElementById("uploadForm");

async function loadImages(){
  galleryDiv.innerHTML="";
  const { data, error } = await supabase.storage.from('gallery').list('', { limit:100 });
  if(error){console.error(error); return;}
  for(let img of data){
    const { publicURL } = supabase.storage.from('gallery').getPublicUrl(img.name);
    const imgEl = document.createElement("img");
    imgEl.src = publicURL;
    galleryDiv.appendChild(imgEl);
  }
}

form.addEventListener("submit", async(e)=>{
  e.preventDefault();
  const fileInput = document.getElementById("imgInput");
  const dateInput = document.getElementById("uploadDate").value;
  const nameInput = document.getElementById("uploaderName").value;
  if(!fileInput.files[0] || !dateInput || !nameInput){alert("Tölts ki minden mezőt!"); return;}

  const file = fileInput.files[0];
  const fileName = `${Date.now()}_${file.name}`;
  const { data, error } = await supabase.storage.from('gallery').upload(fileName, file);
  if(error){alert("Hiba a feltöltés során: "+error.message); return;}
  fileInput.value="";
  dateInput.value="";
  nameInput.value="";
  loadImages();
});

window.addEventListener("load", loadImages);
</script>
</body>
</html>
