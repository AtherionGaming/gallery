<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atherion Gaming - Galéria</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Arial;background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');background-size:cover;color:white;}
.header{text-align:center;font-family:'Cinzel';font-size:50px;color:#00cfff;text-shadow:0 0 30px #00cfff;margin-bottom:10px;}
.menu{display:flex;justify-content:center;gap:15px;margin-top:10px;}
.menu button{padding:12px 20px;font-family:'Cinzel';font-size:16px;border-radius:8px;border:2px solid #00cfff;background:#070d14;color:#00eaff;cursor:pointer;transition:0.3s;}
.menu button:hover{box-shadow:0 0 20px #00cfff;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,150px);gap:15px;margin:20px;}
.gallery img{width:150px;height:150px;object-fit:cover;border-radius:8px;border:2px solid #00cfff;cursor:pointer;}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;z-index:9999;}
#modalContent{position:relative;display:flex;flex-direction:column;align-items:center;}
#modalContent img{max-width:90%;max-height:80%;border:2px solid #00cfff;border-radius:8px;}
#modalInfo{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,0.6);padding:5px 10px;border-radius:6px;font-size:12px;color:#00eaff;}
#zoomBtns{position:absolute;top:5px;right:5px;display:flex;gap:5px;}
#zoomBtns button{padding:5px 8px;border:none;border-radius:5px;background:rgba(0,50,80,0.8);color:#00eaff;cursor:pointer;}
</style>
</head>
<body>
<div class="header">Atherion Gaming - Galéria</div>
<div class="menu">
<button onclick="window.location.href='https://atheriongaming.github.io/index/'">Vissza</button>
</div>
<div class="gallery" id="gallery"></div>

<div id="modal">
<div id="modalContent">
<img id="modalImg" src="">
<div id="modalInfo"></div>
<div id="zoomBtns">
<button onclick="zoomIn()">+</button>
<button onclick="zoomOut()">-</button>
<button onclick="closeModal()">Bezár</button>
</div>
</div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const server = urlParams.get('server') || 'magic';
const galleryKey = 'gallery_' + server;
let images = JSON.parse(localStorage.getItem(galleryKey)||'[]');
const galleryDiv = document.getElementById('gallery');
let currentZoom = 1;

images.forEach((img,i)=>{
  const el = document.createElement('img');
  el.src = img.url;
  el.alt = img.uploader + ' ' + img.date;
  el.onclick=()=>openModal(i);
  galleryDiv.appendChild(el);
});

let currentIndex = 0;
function openModal(index){
  currentIndex=index;
  const modal=document.getElementById('modal');
  const modalImg=document.getElementById('modalImg');
  const modalInfo=document.getElementById('modalInfo');
  modal.style.display='flex';
  modalImg.src=images[index].url;
  modalInfo.innerText=`${images[index].date} - ${images[index].uploader}`;
  currentZoom=1;
  modalImg.style.transform='scale(1)';
}
function closeModal(){
  document.getElementById('modal').style.display='none';
}
function zoomIn(){
  currentZoom+=0.2;
  document.getElementById('modalImg').style.transform=`scale(${currentZoom})`;
}
function zoomOut(){
  currentZoom=Math.max(0.2,currentZoom-0.2);
  document.getElementById('modalImg').style.transform=`scale(${currentZoom})`;
}
</script>
</body>
</html>
