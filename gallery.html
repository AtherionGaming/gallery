<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galéria</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Arial;background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');background-size:cover;color:white;}
.header{text-align:center;font-family:'Cinzel';font-size:50px;color:#00cfff;text-shadow:0 0 20px #00cfff;margin:15px 0;}
.menu{display:flex;justify-content:flex-start;gap:15px;padding:15px;}
.menu-slot{padding:10px 20px;border:2px solid #3a6f9e;border-radius:8px;text-align:center;cursor:pointer;color:#00cfff;background:#070d14;transition:0.3s;font-family:'Cinzel';}
.menu-slot:hover{box-shadow:0 0 20px #00cfff;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,150px);gap:15px;padding:15px;}
.gallery img{width:150px;height:150px;object-fit:cover;border-radius:8px;border:2px solid #00cfff;cursor:pointer;}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;z-index:9999;}
#modalContent{position:relative;background:#000;padding:10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;max-width:90%;max-height:90%;}
#modalContent img{max-width:100%;max-height:80vh;border-radius:6px;}
#modalInfo{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,0.6);color:#00eaff;padding:5px;border-radius:6px;font-size:14px;}
#modalClose{margin-top:10px;padding:6px 12px;border:none;border-radius:6px;background:#00cfff;color:#001a26;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>
<div class="header">Galéria</div>
<div class="menu">
<div class="menu-slot" onclick="window.location.href='/index/'">Vissza</div>
</div>
<div class="gallery" id="gallery"></div>

<div id="modal">
  <div id="modalContent">
    <img id="modalImg">
    <div id="modalInfo"></div>
    <button id="modalClose" onclick="closeModal()">Bezár</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Supabase beállítás
const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
const supabase = supabase.createClient(supabaseUrl, supabaseKey);

// Szerver paraméter
const urlParams = new URLSearchParams(window.location.search);
const server = urlParams.get('server') || 'magic';

async function loadGallery(){
  const { data, error } = await supabase.from('images').select('*').eq('server', server);
  if(error){ console.error(error); return; }
  const gallery=document.getElementById("gallery");
  gallery.innerHTML="";
  data.forEach(img=>{
    const el=document.createElement("img");
    el.src=img.url;
    el.dataset.date=img.date;
    el.dataset.uploader=img.uploader;
    el.onclick=()=>openModal(el);
    gallery.appendChild(el);
  });
}

function openModal(el){
  const modal=document.getElementById("modal");
  const modalImg=document.getElementById("modalImg");
  const modalInfo=document.getElementById("modalInfo");
  modal.style.display="flex";
  modalImg.src=el.src;
  modalInfo.innerText=`${el.dataset.date} - ${el.dataset.uploader}`;
}

function closeModal(){ document.getElementById("modal").style.display="none"; }

loadGallery();
</script>
</body>
</html>
