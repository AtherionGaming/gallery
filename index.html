<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galéria - Atherion Gaming</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');background-size:cover;color:white;}
.header{text-align:center;font-family:'Cinzel';font-size:50px;color:#00cfff;text-shadow:0 0 30px #00cfff;margin:15px;}
.menu{width:100%;display:flex;justify-content:center;gap:15px;margin-bottom:20px;flex-wrap:wrap;}
.menu-slot{padding:12px;border:2px solid #3a6f9e;border-radius:8px;text-align:center;cursor:pointer;font-family:'Cinzel';color:#00cfff;background:#070d14;transition:0.3s;}
.menu-slot:hover{box-shadow:0 0 20px #00cfff;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;margin:0 20px;}
.gallery img{width:100%;object-fit:cover;border-radius:8px;border:2px solid #00cfff;cursor:pointer;}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;z-index:9999;}
#modalContent{position:relative;background:#000;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;}
#modalContent img{max-width:90vw;max-height:80vh;border-radius:8px;}
#modalInfo{color:#00eaff;margin-top:5px;font-family:'Cinzel';font-size:14px;}
#modalClose,#modalPrev,#modalNext{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.7);color:#00eaff;border:none;font-size:24px;padding:10px;cursor:pointer;border-radius:6px;}
#modalClose{top:10px;right:10px;transform:none;}
#modalPrev{left:5px;}
#modalNext{right:5px;}
#uploadForm{margin:20px;text-align:center;}
#uploadForm input,#uploadForm button{padding:8px;margin:5px;border-radius:6px;border:2px solid #00cfff;background:#001a26;color:#00eaff;font-family:'Cinzel';}
</style>
</head>
<body>

<div class="header">Atherion Gaming - Galéria</div>
<div class="menu">
  <div class="menu-slot" onclick="window.location.href='/index/'">Vissza</div>
  <div class="menu-slot" onclick="showUploadForm()">Feltöltés</div>
</div>

<div id="uploadForm"></div>
<div class="gallery" id="gallery"></div>

<div id="modal">
  <div id="modalContent">
    <button id="modalClose" onclick="closeModal()">✖</button>
    <button id="modalPrev" onclick="prevImage()">◀</button>
    <img id="modalImg">
    <button id="modalNext" onclick="nextImage()">▶</button>
    <div id="modalInfo"></div>
  </div>
</div>

<script>
const supabaseUrl="https://[YOUR_SUPABASE_URL]";
const supabaseKey="[YOUR_SUPABASE_KEY]";
const supabase=supabase.createClient(supabaseUrl,supabaseKey);
let images=[], currentIndex=0;

async function loadGallery(){
  let {data,error}=await supabase.from("gallery").select("*").order("created_at",{ascending:false});
  if(error) console.log(error);
  else {
    images=data;
    renderGallery();
  }
}

function renderGallery(){
  const gal=document.getElementById("gallery");
  gal.innerHTML="";
  images.forEach((img,i)=>{
    const el=document.createElement("img");
    el.src=img.url;
    el.onclick=()=>{openModal(i)};
    gal.appendChild(el);
  });
}

function openModal(i){
  currentIndex=i;
  const img=images[i];
  document.getElementById("modalImg").src=img.url;
  document.getElementById("modalInfo").innerText=`${img.uploader} - ${new Date(img.date).toLocaleDateString()}`;
  document.getElementById("modal").style.display="flex";
}

function closeModal(){document.getElementById("modal").style.display="none";}
function prevImage(){if(currentIndex>0) openModal(--currentIndex);}
function nextImage(){if(currentIndex<images.length-1) openModal(++currentIndex);}

function showUploadForm(){
  const form=document.getElementById("uploadForm");
  form.innerHTML=`<input type="file" id="imgInput" accept="image/*">
  <input type="date" id="uploadDate">
  <input type="text" id="uploaderName" placeholder="Feltöltő neve">
  <button onclick="uploadImage()">Feltöltés</button>`;
}

async function uploadImage(){
  const file=document.getElementById("imgInput").files[0];
  const date=document.getElementById("uploadDate").value;
  const name=document.getElementById("uploaderName").value;
  if(!file||!date||!name){alert("Tölts ki minden mezőt!");return;}
  const {data,error}=await supabase.storage.from("gallery").upload(file.name,file);
  if(error){alert("Hiba a feltöltés során!"); console.log(error); return;}
  const url=supabase.storage.from("gallery").getPublicUrl(file.name).data.publicUrl;
  const {error:err}=await supabase.from("gallery").insert([{url,date,uploader:name}]);
  if(err){alert("Hiba az adatbázisba íráskor!"); console.log(err); return;}
  loadGallery();
}

loadGallery();
</script>
</body>
</html>
