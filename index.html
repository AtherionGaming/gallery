<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galéria</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background-image:url('https://metin2.download/picture/UOIXWBG4d1PsC0Bjiga6EHj4c380szxg/.jpg');background-size:cover;color:white;}
.header{text-align:center;font-family:'Cinzel';font-size:50px;color:#00cfff;text-shadow:0 0 20px #00cfff;margin:10px;}
.menu{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
.menu button{padding:10px 20px;font-size:18px;border-radius:10px;border:none;cursor:pointer;background:#001a26;color:#00eaff;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;padding:0 20px;}
.gallery img{width:100%;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid #00cfff;}
#modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);justify-content:center;align-items:center;z-index:9999;}
#modalContent{position:relative;background:#000;border-radius:12px;max-width:90%;max-height:90%;display:flex;flex-direction:column;align-items:center;}
#modalContent img{max-width:100%;max-height:100%;border-radius:12px;}
#modalText{position:absolute;bottom:10px;left:10px;color:#00cfff;background:rgba(0,0,0,0.6);padding:5px 10px;border-radius:6px;font-size:14px;}
#modalClose{position:absolute;top:10px;right:10px;padding:5px 10px;background:#001a26;color:#00eaff;border:none;border-radius:6px;cursor:pointer;}
</style>
</head>
<body>
<div class="header">Galéria</div>
<div class="menu">
<button onclick="window.location.href='/index/'">Vissza</button>
<button onclick="showUploadForm()">Feltöltés</button>
</div>
<div class="content" id="mainContent">
<div class="gallery" id="galleryGrid"></div>
</div>

<div id="modal">
<div id="modalContent">
<img id="modalImg" src="">
<div id="modalText"></div>
<button id="modalClose" onclick="closeModal()">Bezár</button>
</div>
</div>

<script>
const SUPABASE_URL="YOUR_SUPABASE_URL";
const SUPABASE_KEY="YOUR_SUPABASE_ANON_KEY";
const supabase = Supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const galleryGrid=document.getElementById("galleryGrid");

async function loadImages(){
  const serverParam=new URLSearchParams(window.location.search).get('server')||'magic';
  const {data,error}=await supabase.from('gallery').select('*').eq('server',serverParam).order('created_at',{ascending:false});
  galleryGrid.innerHTML="";
  if(data) data.forEach(img=>{
    const el=document.createElement('img');
    el.src=img.url; el.dataset.date=img.date; el.dataset.uploader=img.uploader;
    el.onclick=()=>openModal(img.url,img.date,img.uploader);
    galleryGrid.appendChild(el);
  });
}

function openModal(src,date,uploader){
  document.getElementById("modalImg").src=src;
  document.getElementById("modalText").innerText=`${date} - ${uploader}`;
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function showUploadForm(){
  mainContent.innerHTML=`
  <form id="uploadForm" style="display:flex;flex-direction:column;gap:10px;padding:20px;">
    <input type="file" id="imgInput" accept="image/*" required>
    <input type="text" id="uploaderName" placeholder="Feltöltő neve" required>
    <input type="date" id="uploadDate" required>
    <button type="button" onclick="uploadImage()">Feltöltés</button>
  </form>`;
}

async function uploadImage(){
  const file=document.getElementById("imgInput").files[0];
  const name=document.getElementById("uploaderName").value;
  const date=document.getElementById("uploadDate").value;
  if(!file || !name || !date){ alert("Töltsd ki az összes mezőt!"); return; }
  const {data:upload,error}=await supabase.storage.from('gallery').upload(`${Date.now()}_${file.name}`,file);
  if(error){ alert("Feltöltési hiba"); return; }
  const {data:dbError}=await supabase.from('gallery').insert([{server:new URLSearchParams(window.location.search).get('server')||'magic',url:`${SUPABASE_URL}/storage/v1/object/public/gallery/${upload.path}`,uploader:name,date:date}]);
  showUploadForm();
  loadImages();
}

loadImages();
</script>
</body>
</html>
